[project]
name = "metrics-from-scratch"
version = "0.1.0"
description = "Evaluation metrics and statistics from scratch in numpy, checked against sklearn and scipy."
readme = "README.md"
authors = [{ name = "Bhavya Sharma" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
mfs = "metrics_from_scratch.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
